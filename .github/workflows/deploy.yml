# Deploy static site to Cloudflare Workers.
#
# Trigger a rebuild from WordPress (e.g. after menu changes) without a git push:
#   POST https://api.github.com/repos/<OWNER>/<REPO>/dispatches
#   Headers:
#     Accept: application/vnd.github+json
#     Authorization: Bearer <PAT>
#   Body: { "event_type": "menu_updated", "client_payload": {} }
#
# PAT: classic -> scope `repo`. Fine-grained -> Contents: Read and Write on this repo.
# Keep the token only in WP config / a secrets store — never in public source code.

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  repository_dispatch:
    types:
      - menu_updated

# If several webhooks fire in a short time, cancel older runs and keep the latest.
concurrency:
  group: cloudflare-workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # push: that commit; repository_dispatch / workflow_dispatch: tip of `dev`
          ref: ${{ github.event_name == 'push' && github.sha || 'dev' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          PUBLIC_GRAPHQL_URL: ${{ secrets.PUBLIC_GRAPHQL_URL }}
          GRAPHQL_BASIC_USER: ${{ secrets.GRAPHQL_BASIC_USER }}
          GRAPHQL_BASIC_PASSWORD: ${{ secrets.GRAPHQL_BASIC_PASSWORD }}

      - name: Deploy to Cloudflare Workers
        run: |
          rm -rf .wrangler
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
