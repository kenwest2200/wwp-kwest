name: Deploy to Cloudflare Worker

on:
  push:
    branches:
      - stage

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          PUBLIC_GRAPHQL_URL: ${{ vars.PUBLIC_GRAPHQL_URL_STAGE }}
          GRAPHQL_BASIC_USER: ${{ secrets.GRAPHQL_BASIC_USER }}
          GRAPHQL_BASIC_PASSWORD: ${{ secrets.GRAPHQL_BASIC_PASSWORD }}

      - name: Deploy (STAGE)
        run: npx wrangler deploy --env stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
